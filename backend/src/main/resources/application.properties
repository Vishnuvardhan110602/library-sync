server.port=8080
spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/library_sync?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Open Library ---
openlibrary.base-url=https://openlibrary.org
openlibrary.query=${OPENLIBRARY_QUERY:programming}
openlibrary.limit=${OPENLIBRARY_LIMIT:50}

# --- Scheduler: 5 minutes = 300000 ms ---
sync.interval-ms=300000
sync.initial-delay-ms=10000

# --- CORS: the React dev server ---
cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}