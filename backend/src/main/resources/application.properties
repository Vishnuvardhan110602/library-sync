server.port=8080
spring.application.name=library

# --- Database (override with environment variables) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_sync?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:library_user}
spring.datasource.password=${DB_PASSWORD:mysql}

# Schema is created by database/schema.sql, so Hibernate must not touch it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Open Library ---
openlibrary.base-url=https://openlibrary.org
openlibrary.query=${OPENLIBRARY_QUERY:programming}
openlibrary.limit=${OPENLIBRARY_LIMIT:50}

# --- Scheduler: 5 minutes = 300000 ms ---
sync.interval-ms=300000
sync.initial-delay-ms=10000

# --- CORS: the React dev server ---
cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}